springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.motorliberacaocredito.infrastructure.entrypoint
  paths-to-match: /api/v1/credito/**

# Informações da API
openapi:
  info:
    title: Motor de Crédito API
    description: API para avaliação de crédito, consulta de saldo/score e campanhas de renegociação
    version: 1.0.0
    servers:
      - url: /api/v1

# ==========================================
# Configurações da Aplicação
# Motor de Liberação de Crédito
# ==========================================

spring:
             # Exibe as queries SQL geradas no console

  application:
    name: motor-liberacao-credito

  # ------------------------------------------
  # Configurações do Banco de Dados H2 em Memória
  # ------------------------------------------
  datasource:
    url: jdbc:h2:mem:creditodb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # ------------------------------------------
  # Console H2 (acesso via browser)
  # URL: http://localhost:8080/h2-console
  # ------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console

  # ------------------------------------------
  # JPA / Hibernate
  # ------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
    ddl-auto: update   # Cria as tabelas ao iniciar e remove ao encerrar
    show-sql: true             # Exibe as queries SQL geradas no console
    properties:
      hibernate:
        format_sql: true

# ------------------------------------------
# Configurações do Servidor
# ------------------------------------------
server:
  port: 8080

